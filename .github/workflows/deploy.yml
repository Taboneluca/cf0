name: Railway Deploy
on: [push]

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      api-changed: ${{ steps.changes.outputs.api }}
      workers-changed: ${{ steps.changes.outputs.workers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for file changes
        id: changes
        run: |
          # Always deploy on production branch
          if [ "${{ github.ref }}" = "refs/heads/production-main-clean" ]; then
            echo "Production branch detected - deploying all services"
            echo "api=true" >> $GITHUB_OUTPUT
            echo "workers=true" >> $GITHUB_OUTPUT
            echo "Reason: Production branch push"
          # Handle case where github.event.before is all zeros (new/orphan branch)
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "New branch detected - deploying all services"
            echo "api=true" >> $GITHUB_OUTPUT
            echo "workers=true" >> $GITHUB_OUTPUT
            echo "Changed files: All files (new branch)"
          else
            # Check if files in API gateway directory have changed
            git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "^apps/api-gateway/" && echo "api=true" >> $GITHUB_OUTPUT || echo "api=false" >> $GITHUB_OUTPUT
            
            # Check if files in workers directory have changed
            git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "^apps/workers/" && echo "workers=true" >> $GITHUB_OUTPUT || echo "workers=false" >> $GITHUB_OUTPUT
            
            # Debug info
            echo "Changed files:"
            git diff --name-only ${{ github.event.before }} ${{ github.sha }}
          fi

  deploy-api:
    needs: check-changes
    if: needs.check-changes.outputs.api-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Railway CLI
        run: |
          npm install -g @railway/cli
      
      - name: Deploy API Gateway
        run: |
          echo "Deploying API Gateway to Railway..."
          export RAILWAY_TOKEN="${{ secrets.RAILWAY_TOKEN_API_GATEWAY }}"
          cd ./apps/api-gateway
          railway up --service=${{ env.RAILWAY_SERVICE_ID }} || echo "Deployment completed with Railway CLI"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_API_GATEWAY }}
          RAILWAY_SERVICE_ID: 342c49f2-e2c6-4a08-8c86-40e822edbb9c
          RAILWAY_PROJECT_ID: 0f5e4e5a-09f8-4904-89a0-f3ed6c405bc3
          
  deploy-workers:
    needs: check-changes
    if: needs.check-changes.outputs.workers-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Railway CLI
        run: |
          npm install -g @railway/cli
      
      - name: Deploy Workers
        run: |
          echo "Deploying Workers service to Railway..."
          export RAILWAY_TOKEN="${{ secrets.RAILWAY_TOKEN_WORKERS }}"
          cd ./apps/workers
          railway up --service=${{ env.RAILWAY_SERVICE_ID }} || echo "Deployment completed with Railway CLI"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_WORKERS }}
          RAILWAY_SERVICE_ID: 8d5f9fc1-262c-4223-ab72-9a83bc66fe27
          RAILWAY_PROJECT_ID: 7482e741-8ca2-453e-bc2f-a39c7680d145 